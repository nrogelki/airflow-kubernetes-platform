extends: default
ignore: |
  .venv/
  helm/values.yaml
  k8s/pod_templates/pod_template.yaml
  # Templates are not valid YAML until rendered (tests/test_render_config.sh validates the output)
  *.template.yaml
rules:
  line-length: { max: 140, level: warning }
  document-start: disable
  truthy: { check-keys: false }
  braces: { max-spaces-inside: 1 }
  commas: { max-spaces-after: -1 }
  colons: { max-spaces-after: -1 }
  comments: { min-spaces-from-content: 1 }
  comments-indentation: disable
