name: Propuesta de mejora
description: Sugiere una funcionalidad o cambio
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema que resuelve
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
