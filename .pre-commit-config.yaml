repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(helm/values\.template\.yaml|k8s/pod_templates/pod_template\.template\.yaml)$
        args: [--allow-multiple-documents]
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-executables-have-shebangs
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Known false positives are audited in the baseline:
        #   detect-secrets scan --baseline .secrets.baseline && detect-secrets audit .secrets.baseline
        args: [--baseline, .secrets.baseline]
        exclude: ^(LICENSE|\.secrets\.baseline)$
  - repo: local
    hooks:
      - id: check-dags
        name: check-dags
        entry: python3 tools/check_dags.py
        language: system
        pass_filenames: false
        files: ^(dags|libs)/
